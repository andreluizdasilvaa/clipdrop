appId: com.clipdrop.desktop
productName: ClipDrop
copyright: Copyright © 2026 ClipDrop
directories:
  output: release
files:
  - src/**/*
  - package.json
  - node_modules/**/*
win:
  icon: src/renderer/assets/logos/icon/logo_sem_fundo_sem_texto.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}.${ext}"
mac:
  target:
    - dmg
  category: public.app-category.utilities
linux:
  target:
    - AppImage
  category: AudioVideo
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: src/renderer/assets/logos/icon/logo_sem_fundo_sem_texto.ico
  uninstallerIcon: src/renderer/assets/logos/icon/logo_sem_fundo_sem_texto.ico
